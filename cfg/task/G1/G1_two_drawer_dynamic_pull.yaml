# @package task
defaults:
  - /task/G1/G1
  - _self_

name: G1TwoDrawerDynamicPull
num_envs: 256
max_episode_length: 105
robot:
  name: g1_col_full_arm_contact70_drawer_palm
flags: []
eval_contact_forces: true
objects:
  - type: drawer_cabinet
    name: drawer_cabinet
    pos: [0.0, 0.0, 0.0]
    usd_path: artifacts/drawer_task/two_drawer_preview/assets/two_drawer_cabinet.usd
action:
  _target_: active_adaptation.envs.mdp.action.JointPosition
  action_scaling: {".*": 0.5}
  max_delay: 0
  alpha: [1.0, 1.0]
  boot_protect: false
command:
  _target_: active_adaptation.envs.mdp.commands.drawer_pull_task.TwoDrawerDynamicPullCommand
  dataset_step_limit: 105
  student_train: false
  foot_force: {enabled: false}
  sole_offset: [0.0, 0.0, -0.03540915]
  joint_patterns: [".*"]
  ignore_joint_patterns: []
  dataset:
    mem_paths: [two_drawer_dynamic_multi/train]
    path_weights: [1.0]
    sample_once: false
    position_z_offset: 0.0
    clamp_joint_targets: false
    buffer_float_dtype: float32
  dataset_extra_keys: []
  init_noise:
    root_pos: 0.0
    root_ori: 0.0
    root_lin_vel: 0.0
    root_ang_vel: 0.0
    joint_pos: 0.0
    joint_vel: 0.0
  reward_sigma:
    root_pos: [0.08]
    root_vel: [0.5]
    root_rot: [0.3]
    root_ang_vel: [1.0]
    keypoint: [0.1]
    lower_keypoint: [0.1]
    joint_pos: [0.15]
    joint_vel: [1.0]
    ee: [0.06]
    ee_rot: [0.3]
    feet: [0.06]
observation:
  policy:
    target_support_xyz_b: {}
    root_ang_vel_history: {history_steps: [0], noise_std: 0.02}
    projected_gravity_history: {history_steps: [0], noise_std: 0.005}
    joint_pos_history: {history_steps: [0, 1, 2, 3, 4], noise_std: 0.003}
    prev_actions: {steps: 3}
  joint_target:
    target_joint_pos_obs: {}
  priv:
    target_pos_b_obs: {}
    target_linvel_b_obs: {}
    relative_quat_obs: {}
    target_projected_gravity_b: {}
    root_linvel_b: {}
    current_keypoint_b: {}
    current_keypoint_vel_b: {}
    target_keypoints_diff_b_obs: {}
    applied_torque: {}
  priv_critic:
    cum_error: {}
reward:
  _student_train_: false
  tracking:
    wall_hand_tracking: {weight: 15.0}
    drawer_right_hand_tracking: {weight: 12.0}
    cabinet_hand_support: {weight: 20.0}
    drawer_hand_contact: {weight: 3.0}
    drawer_progress: {weight: 20.0}
    drawer_target_tracking: {weight: 8.0}
    drawer_open_success: {weight: 15.0}
    support_foot_tracking: {weight: 4.0}
    root_pos_tracking: {weight: 6.0}
    root_rot_tracking: {weight: 10.0}
    joint_pos_tracking: {weight: 4.0}
  loco:
    survival: {weight: 1.0}
    joint_vel_l2: {weight: 0.0005, joint_names: ".*"}
    action_rate_l2: {weight: 0.1}
    joint_pos_limits: {weight: 1.0, joint_names: ".*", soft_factor: 0.9}
randomization:
  perturb_body_materials:
    body_names: ".*ankle_roll_link"
    static_friction_range: [2.0, 2.0]
    dynamic_friction_range: [1.8, 1.8]
    restitution_range: [0.0, 0.0]
termination:
  cum_error: {thres: 100.0, min_steps: 50}
  root_height_below: {min_height: 0.55}
  fall_over: {xy_thres: 0.8, z_thres: 0.5}
