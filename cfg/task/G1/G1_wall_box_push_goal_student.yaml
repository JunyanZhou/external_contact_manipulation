# @package task
defaults:
  - /task/G1/G1
  - _self_

name: G1WallBoxPushGoalStudent
num_envs: 512
max_episode_length: 1050
robot:
  name: g1_col_full
flags: []
eval_contact_forces: true
objects:
  - type: wall
    name: right_wall
    pos: [0.45, -0.285, 0.8]
    size: [0.40, 0.05, 1.6]
    friction: 0.7
  - type: box_dynamic
    name: push_block
    pos: [0.22, 0.12, 0.04]
    size: [0.12, 0.10, 0.08]
    mass: 0.50
    friction: 0.35
    color: [0.92, 0.38, 0.12]
action:
  _target_: active_adaptation.envs.mdp.action.JointPosition
  action_scaling: {".*": 0.5}
  max_delay: 0
  alpha: [1.0, 1.0]
  boot_protect: false
command:
  _target_: active_adaptation.envs.mdp.commands.table_push_task.TablePushTaskCommand
  dataset_step_limit: 1100
  student_train: false
  foot_force: {enabled: false}
  sole_offset: [0.0, 0.0, -0.03540915]
  joint_patterns: [".*"]
  ignore_joint_patterns: []
  dataset:
    mem_paths: [wall_box_parallel_goal_v1/train]
    path_weights: [1.0]
    sample_once: false
    position_z_offset: 0.0
    clamp_joint_targets: false
    buffer_float_dtype: float32
  dataset_extra_keys: []
  init_noise:
    root_pos: 0.0
    root_ori: 0.0
    root_lin_vel: 0.0
    root_ang_vel: 0.0
    joint_pos: 0.0
    joint_vel: 0.0
  reward_sigma:
    root_pos: [0.08]
    root_vel: [0.5]
    root_rot: [0.3]
    root_ang_vel: [1.0]
    keypoint: [0.1]
    lower_keypoint: [0.1]
    joint_pos: [0.15]
    joint_vel: [1.0]
    ee: [0.06]
    ee_rot: [0.3]
    feet: [0.06]
observation:
  policy:
    target_support_xyz_b: {}
    root_ang_vel_history: {history_steps: [0], noise_std: 0.02}
    projected_gravity_history: {history_steps: [0], noise_std: 0.005}
    joint_pos_history: {history_steps: [0, 1, 2, 3, 4], noise_std: 0.003}
    prev_actions: {steps: 3}
  joint_target:
    target_joint_pos_obs: {}
  priv:
    target_pos_b_obs: {}
    target_linvel_b_obs: {}
    relative_quat_obs: {}
    target_projected_gravity_b: {}
    root_linvel_b: {}
    current_keypoint_b: {}
    current_keypoint_vel_b: {}
    target_keypoints_diff_b_obs: {}
    applied_torque: {}
  priv_critic:
    cum_error: {}
reward:
  _student_train_: false
  tracking:
    swing_foot_tracking: {weight: 6.0}
    support_foot_tracking: {weight: 4.0}
    wall_hand_tracking: {weight: 4.0}
    right_wall_support: {weight: 2.0}
    box_parallel_progress: {weight: 4.0}
    box_normal_stability: {weight: 3.0}
    root_pos_tracking: {weight: 2.0}
    root_rot_tracking: {weight: 1.0}
    joint_pos_tracking: {weight: 1.0}
  loco:
    survival: {weight: 1.0}
    joint_vel_l2: {weight: 0.0005, joint_names: ".*"}
    action_rate_l2: {weight: 0.1}
    joint_pos_limits: {weight: 1.0, joint_names: ".*", soft_factor: 0.9}
randomization: {}
termination:
  cum_error: {thres: 1.0, min_steps: 50}
